SPDX-FileCopyrightText = "2025-2026 DeMoD LLC"
SPDX-License-Identifier = "GPL-3.0-only OR LicenseRef-DeMoD-Commercial"

# --- Files that quote SPDX lines or third-party notices as text ---------------
# Licensing docs, the PR template and the notices file show identifiers and
# third-party copyright lines as examples or records, not as their own notice.
[[annotations]]
path = [
  "LICENSING.md",
  "THIRD_PARTY_LICENSES.md",
  "CONTRIBUTING.md",
  ".github/PULL_REQUEST_TEMPLATE.md",
  "quanta/LICENSING.md",
]
precedence = "override"
SPDX-FileCopyrightText = "2025-2026 DeMoD LLC"
SPDX-License-Identifier = "MPL-2.0"

# Copyright and licence for every file that does not carry a complete SPDX
# header of its own (REUSE Specification 3.3). `reuse lint` checks the whole
# tree against this file and LICENSES/; .github/workflows/ci.yml runs it.
#
# The layers are the ones LICENSING.md describes. Precedence is "closest"
# unless a block says otherwise: a file's own header wins, and a file whose
# header has only a copyright line or only a licence tag takes the missing
# half from the block that matches it. When several blocks match one file,
# the LAST one applies, so the catch-all comes first.
version = 1

# --- The framework: MPL-2.0 (LICENSE) ---------------------------------------
# Everything not claimed by a later block: src/, include/, examples/, tools/,
# tests/, the shells (shell/, auto/, dash/, gcs/, rov/), apps/mixer/, web/
# (the WebAssembly host page), docs, build and editor configuration, CI, the
# screenshots in assets/ (rendered by this framework's own examples) and
# flake.lock (written by `nix flake lock` for this flake).
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2025-2026 DeMoD LLC"
SPDX-License-Identifier = "MPL-2.0"

# --- The dual-licensed engines: GPL-3.0-only OR the DeMoD commercial licence -
# audio-stack/ (audio-stack/LICENSE, audio-stack/orchestrator/LICENSE),
# quanta/ (quanta/LICENSE) and the DCF-Snake NixOS modules. The commercial
# option is described in LICENSES/LicenseRef-DeMoD-Commercial.txt.
[[annotations]]
path = ["audio-stack/**", "quanta/**", "nixos/modules/snake-*.nix"]
SPDX-FileCopyrightText = "2025-2026 DeMoD LLC"
SPDX-License-Identifier = "GPL-3.0-only OR LicenseRef-DeMoD-Commercial"

# The quanta browser panel is the framework-facing exception (MPL-2.0).
[[annotations]]
path = "quanta/ui/quanta_panel.lua"
SPDX-FileCopyrightText = "2025-2026 DeMoD LLC"
SPDX-License-Identifier = "MPL-2.0"

# --- The DCF remote transport: LGPL-3.0-only ------------------------------------
# audio-stack/bridge/ (except demod-dcf-audiocast.c, whose own header keeps it
# dual-licensed), web/bridge/ (dcf-ws-bridge, including the Cargo files), the
# vendored HydraMesh codec headers, and the custos gate. custos.gen.c is
# compiler output (see web/bridge/custos/PROVENANCE.md) and is never edited,
# so its notice lives here: Exsecutor's LICENSE.EXCEPTION Exception A covers
# the compiler's part, Exsecutor's LICENSE.GRANTS the compiled program's.
# third_party/hydramesh/ is copied byte-identical from github.com/ALH477/HydraMesh
# (DeMoD LLC); see THIRD_PARTY_LICENSES.md for the stray "GPL-3.0" comment in
# demod_frame.h, which upstream's own SPDX line contradicts.
[[annotations]]
path = ["audio-stack/bridge/**", "web/bridge/**", "third_party/hydramesh/**"]
SPDX-FileCopyrightText = "2025-2026 DeMoD LLC"
SPDX-License-Identifier = "LGPL-3.0-only"

# --- TERMINUS: PolyForm Shield 1.0.0 (apps/terminus/LICENSE) -----------------
# Patch manifests, READMEs, MIDI and frame data, and the generated Lua frame
# indexes. The LGPL-3.0-only demod-jam copies and the MIT DeMoD_Vox.dsp carry
# their own headers, which win over this block.
#
# Provenance assumed: patches/duck-anim-frames.bin, patches/demod-duck-dance/
# duck-anim-frames.bin and their .lua indexes were generated from duck-pixel.gif
# and duck-dance.mid, which are not in the tree and whose origin is not
# recorded (THIRD_PARTY_LICENSES.md). If either is someone else's work, these
# files need that owner's licence and notice, or replacement.
[[annotations]]
path = "apps/terminus/**"
SPDX-FileCopyrightText = "2025-2026 DeMoD LLC"
SPDX-License-Identifier = "LicenseRef-PolyForm-Shield-1.0.0"

# Patches whose Faust metadata (`declare license`) names another licence. The
# declarations shipped with the files and are not withdrawn: each file is
# available under Shield OR the licence it declares (LICENSING.md, TERMINUS).
[[annotations]]
